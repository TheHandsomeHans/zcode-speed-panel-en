[package]
name = "zcode-speed-panel"
version = "0.4.8"
description = "ZCode output speed panel (tray-resident)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
# In-app updates: synchronous blocking HTTP client (rustls, no OpenSSL dependency, cross-build friendly on mac)
ureq = { version = "2", features = ["json", "native-certs"] }

# Launch at login (autostart.rs): HKCU Run registry read/write, Windows only
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
codegen-units = 1
lto = true
strip = true
